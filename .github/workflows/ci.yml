name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib ortools scikit-optimize pytest

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall implementations/

      - name: Run Exact CP-SAT Scheduler
        run: |
          python implementations/v1_exact_cpsat_solver/main_cpsat_runner.py

      - name: Run QUBO-APR Engine Benchmark
        run: |
          python implementations/v2_cce_qubo_apr_engine/cce_qubo_benchmark.py

      - name: Run KV-Cache Paging Scheduler
        run: |
          python implementations/v3_llm_kvcache_continuous_batching/llm_kvcache_paging_scheduler.py

      - name: Run pytest suite
        run: |
          python -m pytest -q tests
